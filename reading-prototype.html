<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Comprehension Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Lexend:wght@300;400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500&display=swap">
<style>
/* Layout: one quiet reading column, sticky top bar, reading toolbar, bottom action bar.
   Content sizes are in rem so the A− / A+ buttons scale every page. */
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --ink:#18202F; --muted:#6A7385; --line:#E2E6EC;
  --accent:#2B4FD8; --accent-soft:#E8EDFF; --mark:#FFE071; --mark-ink:#18202F;
  --good:#1D8A57; --good-soft:#DDF3E6; --bad:#C0453E; --bad-soft:#FCE9E7; --rec:#E0413A;
  --tint-cream:#FBF5E6; --tint-blue:#EAF2FB; --on-accent:#FFFFFF;
  --f-title:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-alt:"Atkinson Hyperlegible",Verdana,sans-serif;
  --f-hi:"Noto Sans Devanagari","Nirmala UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151F; --surface:#171E2B; --ink:#E7EBF2; --muted:#98A1B3; --line:#283245;
  --accent:#8AA3FF; --accent-soft:#1F2A4A; --good:#52C48E; --good-soft:#15301F; --bad:#F2827A; --bad-soft:#371C1B; --rec:#FF6A62;
  --tint-cream:#211D14; --tint-blue:#132133; --on-accent:#10151F; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;transition:background .2s;padding-top:env(safe-area-inset-top,0px)}
body.t-cream{--bg:var(--tint-cream)} body.t-blue{--bg:var(--tint-blue)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.col{max-width:620px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* Top bar (fixed px so it does not grow with text size) */
.top{position:sticky;top:0;z-index:5;background:var(--bg)}
.top .col{display:flex;align-items:center;gap:6px;height:64px}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;font-size:15px}
.icon:hover{background:var(--line)}
.icon:disabled{opacity:.35;cursor:default;background:none}
.icon.off{color:var(--muted)}
.fs{font-family:var(--f-title);font-weight:600;letter-spacing:-.02em}
.fs small{font-size:11px}
.step{flex:1;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s}

/* Reading toolbar */
.rbar{position:sticky;top:67px;z-index:4;background:var(--bg)}
.rbar .col{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.pill{height:40px;border-radius:20px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.pill.rec .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.seg2{display:inline-flex;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface);height:40px}
.seg2 button{padding:0 13px;font-size:14px;color:var(--muted)}
.seg2 button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}

/* Main content (rem) */
main .col{padding-block:24px 140px;display:flex;flex-direction:column;gap:1.25rem}
h1{font-family:var(--f-title);font-weight:600;font-size:2.125rem;line-height:1.1;margin:0;text-wrap:balance}
.q{font-size:1.25rem;font-weight:500;line-height:1.35;margin:0;text-wrap:balance}
.q.sm{font-size:1.125rem}
.sub{color:var(--muted);margin:0}
.small{font-size:.8125rem;color:var(--muted);margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;padding:.95rem 1rem;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:1rem;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.opt:disabled{cursor:default}
.opt .n{width:1.6rem;height:1.6rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;flex:0 0 auto}
.opt.set .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{font-size:.875rem;margin:0}
.note.good{color:var(--good)} .note.bad{color:var(--bad)}
.link{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.qrow{display:flex;gap:12px;align-items:flex-start}
.qrow .q{flex:1}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.mini.playing{background:var(--accent);color:var(--on-accent)}

/* Passage */
.para{margin:0;font-size:1.1875rem;line-height:var(--rl,1.9)}
.alt .para{font-family:var(--f-alt)}
.w{border-radius:5px;padding:1px 1px;cursor:pointer;transition:background .12s,color .12s}
.w:hover{background:var(--line)}
.w.now{background:var(--mark);color:var(--mark-ink)}
.w.ok{background:var(--good-soft);color:var(--good)}
.w.skip{text-decoration:underline wavy var(--bad) 1.5px;text-underline-offset:5px}
.w.cur{box-shadow:inset 0 -3px 0 var(--accent);background:var(--accent-soft)}
.tw{border-bottom:2.5px dashed var(--accent);padding-bottom:1px}
.part+.part{padding-top:1.5rem;border-top:1px solid var(--line)}
.part.past .para{opacity:.6}
.hibox{font-family:var(--f-hi);margin-top:12px;font-size:1.0625rem;line-height:1.8;color:var(--muted);padding-left:14px;border-left:2px solid var(--accent)}
.ra{font-size:.875rem;margin:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ra.good{color:var(--good)}
.check{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.check .label{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.done-line{font-size:.875rem;color:var(--good);margin:0}

/* Popover attached to tough words */
#pop{position:absolute;z-index:30;width:max-content;max-width:min(300px,calc(100vw - 24px));background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 14px 34px -14px rgba(10,20,50,.45);display:flex;flex-direction:column;gap:6px}
#pop .arrow{position:absolute;width:14px;height:14px;background:var(--surface);border:1.5px solid var(--accent);transform:rotate(45deg);left:calc(var(--ax) - 7px)}
#pop.above .arrow{bottom:-8px;border-top:0;border-left:0}
#pop.below .arrow{top:-8px;border-bottom:0;border-right:0}
#pop .pw{display:flex;align-items:center;justify-content:space-between;gap:12px}
#pop b{font-family:var(--f-title);font-size:1.2rem;font-weight:600}
#pop .pm{font-size:.95rem;line-height:1.4}
#pop .pe{font-size:.875rem;color:var(--muted);font-style:italic}
#pop .ph{font-family:var(--f-hi);font-size:.875rem;color:var(--accent)}

/* Words */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcard{min-height:9.5rem;padding:1.1rem 1rem;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px}
.wcard b{font-family:var(--f-title);font-weight:600;font-size:1.3125rem}
.wcard.flip{border-color:var(--accent)}
.wcard span{font-size:.875rem;line-height:1.45}
.wcard .hi{font-family:var(--f-hi);color:var(--accent)}
textarea{width:100%;min-height:7rem;border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}

/* Bottom bar (px) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .col{display:flex;gap:8px;align-items:center;padding-block:20px 18px}
.tool{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);flex:0 0 auto}
.tool.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tool .hi{font-family:var(--f-hi);font-size:18px;font-weight:500}
.go{flex:1;height:52px;border-radius:26px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px}
.go:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

/* Sheet */
.veil{position:fixed;inset:0;background:rgba(8,12,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.srow > span{font-size:14px;color:var(--muted)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
.btn2{height:48px;border-radius:24px;padding:0 20px;font-weight:600;border:1.5px solid var(--line)}
.btn2.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100vw - 32px)}

.score{font-family:var(--f-title);font-size:4rem;font-weight:600;color:var(--accent);line-height:1}
.list{display:flex;flex-direction:column}
.list div{display:flex;justify-content:space-between;gap:12px;padding:.75rem 0;border-top:1px solid var(--line);font-size:.9375rem}
.list div span:last-child{color:var(--muted)}
@media (max-width:420px){ .pill .lbl{display:none} .pill{padding:0 12px} .step{display:none} .top .col{justify-content:space-between} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ================= Content (what the content team supplies) ================= */

  title:"The Water Drum", meta:"Grade 4–5 · 8 min · 3 parts",
  goal:"Read to find out how one idea brought water to a whole school.",
  paras:[
    { en:"Every summer, the hand pump in Meera's village went dry. Her mother walked two kilometres to the river with a steel pot on her head. Meera often went with her. One afternoon, as dark clouds [[rolled in|rolled]], she watched the rain pour off the school roof and [[disappear|disappear]] into the mud. \"All that water,\" she whispered, \"and none of it is ours.\"",
      hi:"हर गर्मी में मीरा के गाँव का हैंडपंप सूख जाता था। उसकी माँ सिर पर स्टील का घड़ा रखकर दो किलोमीटर दूर नदी तक जाती थीं। मीरा अक्सर उनके साथ जाती थी। एक दोपहर, जब काले बादल घिर आए, उसने देखा कि बारिश का पानी स्कूल की छत से बहकर मिट्टी में गायब हो रहा है। \"इतना सारा पानी,\" उसने धीरे से कहा, \"और इसमें से हमारा कुछ भी नहीं।\"",

    { en:"The next day, Meera drew a picture for her teacher, Mr. Das. It showed a pipe running from the roof [[gutter|gutter]] into a big plastic drum. A cloth tied over the drum would [[filter|filter]] out leaves and dust. Mr. Das [[studied|studied]] the drawing for a long time. Then he smiled. \"This is called rainwater [[harvesting|harvesting]],\" he said. \"Shall we try it?\"",
      hi:"अगले दिन मीरा ने अपने शिक्षक, दास सर, के लिए एक चित्र बनाया। उसमें छत की नाली से एक पाइप एक बड़े प्लास्टिक के ड्रम तक जा रहा था। ड्रम पर बँधा एक कपड़ा पत्तों और धूल को छान देता। दास सर बहुत देर तक चित्र को ध्यान से देखते रहे। फिर वे मुस्कुराए। \"इसे वर्षा जल संचयन कहते हैं,\" उन्होंने कहा। \"क्या हम इसे आज़माएँ?\"",

const GLOSS = {

},
summary:()=>`${qh("Which sentence tells what the whole story is about?","summary")}
  <div class="opts">${SUMMARY.o.map((o,j)=>{const ok=st.sum===SUMMARY.a; let c=""; if(ok&&j===SUMMARY.a)c="right"; else if(st.wrongSum.includes(j))c="wrong";
    return `<button class="opt ${c}" data-act="sum" data-i="${j}" ${ok||c?"disabled":""}>${o}</button>`}).join("")}</div>
  ${st.sum===SUMMARY.a?`<p class="note good">Yes. It tells the problem, the idea and what happened.</p>`:st.sum!==null?`<p class="note bad">${SUMMARY.why[st.sum]}</p>`:""}`,
reflect:()=>{ const k=st.pred===1?"reflect-right":"reflect-wrong";
  return `<div style="display:flex;flex-direction:column;gap:8px">
    <p class="small">Your guess before reading</p>
    <div class="qrow"><p class="q sm">${st.pred!==null?PREDICT.o[st.pred]:"No guess"}</p><button class="mini" data-act="replay" data-k="${k}" aria-label="Hear it">${I.spk}</button></div>
    <p class="note ${st.pred===1?"good":""}" style="${st.pred===1?"":"color:var(--muted)"}">${st.pred===1?"You were right. They collected the rain to use later.":"They collected the rain to use later. Good readers change their guess as they read."}</p></div>
  <div style="display:flex;flex-direction:column;gap:10px;padding-top:8px">
    <label for="refl" class="q sm">Where have you seen water go to waste near you?</label>
    <textarea id="refl" placeholder="Near my home, water is wasted when…">${esc(st.refl)}</textarea><p class="small">Optional</p></div>`; },
done:()=>{ const n=starCount();
  const ra=Object.values(st.ra), ok=ra.reduce((s,r)=>s+r.marks.filter(x=>x==="ok").length,0), tot=ra.reduce((s,r)=>s+r.marks.length,0);
  return `<div style="padding-top:5vh;display:flex;flex-direction:column;gap:6px">
    <div class="qrow"><p class="small" style="flex:1">You finished ${P.title}</p><button class="mini" data-act="replay" data-k="done-${n}" aria-label="Hear it">${I.spk}</button></div>
    <div class="score">${n}<span style="font-size:1.75rem;color:var(--muted)"> / ${MAX}</span></div><p class="sub">stars for first-try answers</p></div>
  <div class="list">${QUESTIONS.map((q,i)=>{const a=st.qa[i];return `<div><span>${q.skill}</span><span>${!a?"Not tried":a.tries===1?"First try":"With help"}</span></div>`}).join("")}
    <div><span>Reading aloud</span><span>${tot?`${ok} of ${tot} words clear`:"Not tried"}</span></div></div>`;
}
};

function paintRbar(){
  const on=STEPS[st.s].id==="read"; $("rbar").hidden=!on; if(!on) return;
  const r=st.ra[st.chunk];
  $("rbarIn").innerHTML=`
    <button class="pill ${st.reading!==null?"on":""}" data-act="listen" aria-label="${st.reading!==null?"Stop":"Listen to this part"}">${st.reading!==null?I.stop:I.spk}<span class="lbl">${st.reading!==null?"Stop":"Listen"}</span></button>
    <div class="seg2" role="group" aria-label="Reading speed">
      <button class="${st.rate<1?"on":""}" data-act="rate" data-v="0.7" aria-pressed="${st.rate<1}">Slow</button>
      <button class="${st.rate>=1?"on":""}" data-act="rate" data-v="1" aria-pressed="${st.rate>=1}">Normal</button></div>
    <span class="spacer"></span>
    <button class="pill ${st.listening?"rec":""}" data-act="mic" aria-label="${st.listening?"Pause reading aloud":"Read aloud"}">${st.listening?'<span class="dot"></span>':I.mic}<span class="lbl">${st.listening?"Pause":(r&&r.pos>0&&!r.done?"Resume":"Read")}</span></button>`;
}
function paintHeader(){
  const b=$("voBtn"); b.innerHTML=st.voOn?I.spk:I.mute; b.classList.toggle("off",!st.voOn);
  b.setAttribute("aria-pressed",st.voOn); b.setAttribute("aria-label",st.voOn?"Voice-over on":"Voice-over off"); b.title=st.voOn?"Voice-over on":"Voice-over off";
  $("fsDown").disabled=st.fs===0; $("fsUp").disabled=st.fs===FS.length-1;
  document.documentElement.style.fontSize=(16*FS[st.fs])+"px";
}
function barHTML(){
  const id=STEPS[st.s].id, go=(t,dis,act="next")=>`<button class="go" data-act="${act}" ${dis?"disabled":""}>${t}</button>`;
  if(id==="start") return go("Start");
  if(id==="predict") return go("Continue",st.pred===null);
  if(id==="words") return go(st.flipped.size<KEYWORDS.length?`Continue · ${st.flipped.size}/${KEYWORDS.length} seen`:"Start the story");
  if(id==="read"){ const ok=st.cp[st.chunk]===P.paras[st.chunk].cp.a, last=st.chunk===P.paras.length-1;
    return `<button class="tool" data-act="tools" aria-label="Reading settings">${I.aa}</button>
      <button class="tool ${st.hiOn[st.chunk]?"on":""}" data-act="hion" aria-label="Show in Hindi" aria-pressed="${!!st.hiOn[st.chunk]}">${I.hi}</button>
      ${go(ok?(last?"Questions":"Next part"):`Part ${st.chunk+1} of ${P.paras.length}`,!ok,last?"next":"chunk")}`; }
  if(id==="quiz"){ const a=st.qa[st.q]; return go(st.q<QUESTIONS.length-1?"Next":"Continue",!(a&&a.correct),"qnext"); }
  if(id==="summary") return go("Continue",st.sum!==SUMMARY.a);
  if(id==="reflect") return go("Finish");
  return go("Read again",false,"restart");
}
let lastScreen=null;
function render(keepMic){
  stopAll(); hidePop(); if(!keepMic&&st.listening) stopMic();
  const step=STEPS[st.s];
  $("view").innerHTML=V[step.id]();
  $("bar").innerHTML=barHTML();
  $("step").textContent= step.id==="read"?`Reading · Part ${st.chunk+1} of ${P.paras.length}`:step.id==="start"?"":step.label;
  $("backBtn").style.visibility= st.s===0||step.id==="done"?"hidden":"visible";
  let p=st.s/(STEPS.length-1);
  if(step.id==="read") p=(3+(st.chunk+(st.cp[st.chunk]===P.paras[st.chunk].cp.a?1:0))/P.paras.length)/(STEPS.length-1);
  if(step.id==="quiz") p=(4+(st.q+(st.qa[st.q]&&st.qa[st.q].correct?1:0))/QUESTIONS.length)/(STEPS.length-1);
  $("prog").style.width=Math.round(p*100)+"%";
  document.body.classList.toggle("t-cream",step.id==="read"&&st.tint==="cream");
  document.body.classList.toggle("t-blue",step.id==="read"&&st.tint==="blue");
  const rf=$("refl"); if(rf) rf.addEventListener("input",e=>st.refl=e.target.value);
  paintHeader(); paintRbar(); if(step.id==="read") paintRA(); renderSheet();
  const key=screenKey();
  if(key!==lastScreen){ lastScreen=key; setTimeout(screenVO,150); }   // each new page plays its voice-over once
}
function keep(){ const y=scrollY; render(true); scrollTo(0,y); }

function renderSheet(){
  const s=st.sheet; if(!s){ $("sheet").innerHTML=""; return; }
  let h="";
  if(s.type==="look"){ const q=QUESTIONS[st.q],p=P.paras[q.ref];
    h=`<p class="small">From part ${q.ref+1}</p><p style="margin:0;font-size:1.125rem;line-height:1.8">${esc(p.plain).replace(esc(q.quote),`<mark>${esc(q.quote)}</mark>`)}</p>
      <button class="btn2 pri" data-act="close">Try again</button>`;
  } else if(s.type==="tools"){
    const seg=(act,opts,c)=>`<div class="seg">${opts.map(([v,l,css])=>`<button class="${c===v?"on":""}" data-act="${act}" data-v="${v}" ${css?`style="${css}"`:""}>${l}</button>`).join("")}</div>`;
    h=`<div class="srow"><span>Font</span>${seg("font",[["std","Standard"],["alt","Easy-read","font-family:var(--f-alt)"]],st.font)}</div>
      <div class="srow"><span>Spacing</span>${seg("wide",[["0","Normal"],["1","Wide"]],st.wide?"1":"0")}</div>
      <div class="srow"><span>Page colour</span>${seg("tint",[["none","Plain"],["cream","Cream"],["blue","Blue"]],st.tint)}</div>
      <p class="small" style="font-size:13px">Use A− and A+ at the top to change text size.</p>
      <button class="btn2 pri" data-act="close">Done</button>`;
  }
  $("sheet").innerHTML=`<div class="veil" data-act="veil"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
}

/* ================= Events ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t){
    const w=e.target.closest(".para .w");
    if(w){
      const tw=w.closest(".tw");
      sayWord(tw?GLOSS[tw.dataset.k].w:w.textContent);
      if(tw) showPop(tw); else { hidePop(); w.classList.add("now"); setTimeout(()=>w.classList.remove("now"),600); }
      return;
    }
    if(!e.target.closest("#pop")) hidePop();
    return;
  }
  const a=t.dataset.act,i=+t.dataset.i,v=t.dataset.v;
  if(a==="veil"){ if(e.target===t){ st.sheet=null; renderSheet(); } return; }
  switch(a){
    case "fs": { const y=scrollY/Math.max(1,document.body.scrollHeight); st.fs=Math.max(0,Math.min(FS.length-1,st.fs+(+v)));
      try{ localStorage.setItem("fs",st.fs); }catch(_){} paintHeader(); if(popFor) showPop(popFor); scrollTo(0,y*document.body.scrollHeight); break; }
    case "vo-toggle": st.voOn=!st.voOn; try{ localStorage.setItem("vo",st.voOn?"on":"off"); }catch(_){}
      paintHeader(); if(st.voOn) screenVO(); else stopAll(); break;
    case "replay": vo(t.dataset.k,true); break;
    case "next": st.s++; render(); scrollTo(0,0); break;
    case "pred": st.pred=i; keep(); vo("pred-ok"); break;
    case "flip": { const k=t.dataset.k; st.flipped.add(k); keep(); st.voOn?vo(`word-${k}`):sayWord(GLOSS[k].w); break; }
    case "close": st.sheet=null; renderSheet(); break;
    case "listen": st.reading!==null?stopAll():listen(st.chunk); break;
    case "rate": { st.rate=+v; const was=st.reading; paintRbar(); if(was!==null) listen(was); break; }
    case "mic": if(st.listening){ stopMic(); render(true); } else startMic(); break;
    case "ra-reset": resetRA(); break;
    case "tools": stopAll(); st.sheet={type:"tools"}; renderSheet(); break;
    case "font": st.font=v; keep(); break;
    case "wide": st.wide=v==="1"; keep(); break;
    case "tint": st.tint=v; keep(); break;
    case "hion": st.hiOn[st.chunk]=!st.hiOn[st.chunk]; keep(); break;
    case "cp": { const cp=P.paras[st.chunk].cp, c=st.chunk; st.cpTries[c]=(st.cpTries[c]||0)+1; st.cp[c]=i; keep(); vo(i===cp.a?`cpok-${c}`:`cpno-${c}`); break; }
    case "chunk": st.chunk++; render(); requestAnimationFrame(()=>{ const p=$("p"+st.chunk); if(p) scrollTo({top:p.getBoundingClientRect().top+scrollY-130,behavior:"smooth"}); }); break;
    case "ans": { const q=QUESTIONS[st.q],x=st.qa[st.q]||{tries:0,wrong:[]}; x.tries++; if(i===q.a) x.correct=true; else x.wrong.push(i); st.qa[st.q]=x; keep();
      vo(i===q.a?(x.tries===1?"q-right1":"q-right2"):"q-wrong"); break; }
    case "seq": { const q=QUESTIONS[st.q]; const k=st.seq.indexOf(i); if(k>-1) st.seq.splice(k,1); else st.seq.push(i);
      if(st.seq.length===q.items.length){ const x=st.qa[st.q]||{tries:0,wrong:[]}; x.tries++; x.correct=st.seq.every((vv,kk)=>vv===q.order[kk]); st.qa[st.q]=x; if(!x.correct) st.seq=[];
        keep(); vo(x.correct?"seq-right":"seq-wrong"); break; }
      keep(); vo(`seqitem-${i}`,true); break; }
    case "look": st.sheet={type:"look"}; renderSheet(); vo("look"); break;
    case "qnext": st.seq=[]; if(st.q<QUESTIONS.length-1) st.q++; else st.s++; render(); scrollTo(0,0); break;
    case "sum": st.sumTries++; st.sum=i; if(i!==SUMMARY.a) st.wrongSum.push(i); keep(); vo(i===SUMMARY.a?"sum-right":`sum-why-${i}`); break;
    case "restart": Object.assign(st,{s:0,pred:null,flipped:new Set(),chunk:0,cp:{},cpTries:{},hiOn:{},q:0,qa:{},seq:[],sum:null,sumTries:0,wrongSum:[],refl:"",sheet:null,ra:{}}); lastScreen=null; render(); scrollTo(0,0); break;
  }
});
$("backBtn").addEventListener("click",()=>{
  const id=STEPS[st.s].id;
  if(id==="read"&&st.chunk>0){ st.chunk--; render(); return; }
  if(id==="quiz"&&st.q>0){ st.q--; st.seq=[]; render(); return; }
  if(st.s>0){ st.s--; render(); scrollTo(0,0); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ hidePop(); if(st.sheet){ st.sheet=null; renderSheet(); } } });
try{ speechSynthesis.getVoices(); }catch(e){}
render();
</script>
</body>
</html>
