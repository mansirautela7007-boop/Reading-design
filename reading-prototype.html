<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Comprehension Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Lexend:wght@300;400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500&display=swap">
<style>
/* Layout: one quiet reading column, sticky top bar, reading toolbar, bottom action bar.
   Content sizes are in rem so the A− / A+ buttons scale every page. */
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --ink:#18202F; --muted:#6A7385; --line:#E2E6EC;
  --accent:#2B4FD8; --accent-soft:#E8EDFF; --mark:#FFE071; --mark-ink:#18202F;
  --good:#1D8A57; --good-soft:#DDF3E6; --bad:#C0453E; --bad-soft:#FCE9E7; --rec:#E0413A;
  --tint-cream:#FBF5E6; --tint-blue:#EAF2FB; --on-accent:#FFFFFF;
  --f-title:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-alt:"Atkinson Hyperlegible",Verdana,sans-serif;
  --f-hi:"Noto Sans Devanagari","Nirmala UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151F; --surface:#171E2B; --ink:#E7EBF2; --muted:#98A1B3; --line:#283245;
  --accent:#8AA3FF; --accent-soft:#1F2A4A; --good:#52C48E; --good-soft:#15301F; --bad:#F2827A; --bad-soft:#371C1B; --rec:#FF6A62;
  --tint-cream:#211D14; --tint-blue:#132133; --on-accent:#10151F; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;transition:background .2s;padding-top:env(safe-area-inset-top,0px)}
body.t-cream{--bg:var(--tint-cream)} body.t-blue{--bg:var(--tint-blue)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.col{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* Top bar (px, does not grow with text size) */
.top{position:sticky;top:0;z-index:5;background:var(--bg)}
.top .col{display:flex;align-items:center;gap:6px;height:64px}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;font-size:15px}
.icon:hover{background:var(--line)}
.icon:disabled{opacity:.35;cursor:default;background:none}
.icon.off{color:var(--muted)}
.fs{font-family:var(--f-title);font-weight:600;letter-spacing:-.02em}
.icon.fs{display:flex;align-items:baseline;justify-content:center;gap:1px;line-height:1}
.fs small{font-size:12px;font-weight:600}
.step{flex:1;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s}

/* Reading toolbar */
.rbar{position:sticky;top:67px;z-index:4;background:var(--bg)}
.rbar .col{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.pill{height:40px;border-radius:20px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.pill.rec .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.seg2{display:inline-flex;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface);height:40px}
.seg2 button{padding:0 13px;font-size:14px;color:var(--muted)}
.seg2 button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}

/* Main content (rem) */
main .col{padding-block:24px 140px;display:flex;flex-direction:column;gap:1.25rem}
h1{font-family:var(--f-title);font-weight:600;font-size:2.125rem;line-height:1.1;margin:0;text-wrap:balance}
.q{font-size:1.25rem;font-weight:500;line-height:1.35;margin:0;text-wrap:balance}
.q.sm{font-size:1.125rem}
.sub{color:var(--muted);margin:0}
.small{font-size:.8125rem;color:var(--muted);margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;padding:.95rem 1rem;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:1rem;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.opt:disabled{cursor:default}
.opt .n{width:1.6rem;height:1.6rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;flex:0 0 auto}
.opt.set .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{font-size:.875rem;margin:0}
.note.good{color:var(--good)} .note.bad{color:var(--bad)}
.link{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.qrow{display:flex;gap:12px;align-items:flex-start}
.qrow .q{flex:1}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.mini.playing{background:var(--accent);color:var(--on-accent)}

/* Passage: all paragraphs together */
#passage{display:flex;flex-direction:column;gap:1.1rem}
.para{margin:0;font-size:1.1875rem;line-height:var(--rl,1.9)}
.alt .para{font-family:var(--f-alt)}
.w{border-radius:5px;padding:1px 1px;cursor:pointer;transition:background .12s,color .12s}
.w:hover{background:var(--line)}
.w.now{background:var(--mark);color:var(--mark-ink)}
.w.ok{background:var(--good-soft);color:var(--good)}
.w.skip{text-decoration:underline wavy var(--bad) 1.5px;text-underline-offset:5px}
.w.cur{box-shadow:inset 0 -3px 0 var(--accent);background:var(--accent-soft)}
.tw{border-bottom:2.5px dashed var(--accent);padding-bottom:1px;cursor:pointer}
.tw.open{background:var(--accent-soft);border-radius:4px}
.hibox{font-family:var(--f-hi);margin-top:-.4rem;font-size:1.0625rem;line-height:1.8;color:var(--muted);padding-left:14px;border-left:2px solid var(--accent)}
.ra{font-size:.875rem;margin:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ra.good{color:var(--good)}

/* Popover attached to tough words (opens on tap) */
#pop{position:absolute;z-index:30;width:max-content;max-width:min(300px,calc(100vw - 24px));background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 14px 34px -14px rgba(10,20,50,.45);display:flex;flex-direction:column;gap:6px}
#pop .arrow{position:absolute;width:14px;height:14px;background:var(--surface);border:1.5px solid var(--accent);transform:rotate(45deg);left:calc(var(--ax) - 7px)}
#pop.above .arrow{bottom:-8px;border-top:0;border-left:0}
#pop.below .arrow{top:-8px;border-bottom:0;border-right:0}
#pop .pw{display:flex;align-items:center;justify-content:space-between;gap:12px}
#pop b{font-family:var(--f-title);font-size:1.2rem;font-weight:600}
#pop .pm{font-size:.95rem;line-height:1.4}
#pop .pe{font-size:.875rem;color:var(--muted);font-style:italic}
#pop .ph{font-family:var(--f-hi);font-size:.875rem;color:var(--accent)}

/* Words */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcard{min-height:9.5rem;padding:1.1rem 1rem;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px}
.wcard b{font-family:var(--f-title);font-weight:600;font-size:1.3125rem}
.wcard.flip{border-color:var(--accent)}
.wcard span{font-size:.875rem;line-height:1.45}
.wcard .hi{font-family:var(--f-hi);color:var(--accent)}
textarea{width:100%;min-height:7rem;border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}

/* Bottom bar (px) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .col{display:flex;gap:8px;align-items:center;padding-block:20px 18px}
.tool{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);flex:0 0 auto}
.tool.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tool .hi{font-family:var(--f-hi);font-size:18px;font-weight:500}
.go{flex:1;height:52px;border-radius:26px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px}
.go:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

/* Sheet */
.veil{position:fixed;inset:0;background:rgba(8,12,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.sheet h2{font-family:var(--f-title);font-weight:600;font-size:24px;margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.srow > span{font-size:14px;color:var(--muted)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
.btn2{height:48px;border-radius:24px;padding:0 20px;font-weight:600;border:1.5px solid var(--line)}
.btn2.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100vw - 32px)}

/* Feature list */
.fgroup{display:flex;flex-direction:column}
.fgroup h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;font-weight:600}
.feat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.feat b{font-weight:600;font-size:15px}
.feat p{grid-column:1/-1;margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.prio{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;align-self:start;white-space:nowrap}
.prio.must{background:var(--good-soft);color:var(--good)}
.prio.good{background:var(--accent-soft);color:var(--accent)}
.prio.later{background:var(--line);color:var(--muted)}

.score{font-family:var(--f-title);font-size:4rem;font-weight:600;color:var(--accent);line-height:1}
.list{display:flex;flex-direction:column}
.list div{display:flex;justify-content:space-between;gap:12px;padding:.75rem 0;border-top:1px solid var(--line);font-size:.9375rem}
.list div span:last-child{color:var(--muted)}
@media (max-width:440px){ .pill .lbl{display:none} .pill{padding:0 12px} .step{display:none} .top .col{justify-content:space-between} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ================= Content (what the content team supplies) ================= */
const P = {
  title:"The Water Drum", meta:"Grades 1–6 · 8 min read",
  goal:"Read to find out how one idea brought water to a whole school.",
  paras:[
    { en:"Every summer, the hand pump in Meera's village went dry. Her mother walked two kilometres to the river with a steel pot on her head. Meera often went with her. One afternoon, as dark clouds [[rolled in|rolled]], she watched the rain pour off the school roof and [[disappear|disappear]] into the mud. \"All that water,\" she whispered, \"and none of it is ours.\"",
      hi:"हर गर्मी में मीरा के गाँव का हैंडपंप सूख जाता था। उसकी माँ सिर पर स्टील का घड़ा रखकर दो किलोमीटर दूर नदी तक जाती थीं। मीरा अक्सर उनके साथ जाती थी। एक दोपहर, जब काले बादल घिर आए, उसने देखा कि बारिश का पानी स्कूल की छत से बहकर मिट्टी में गायब हो रहा है। \"इतना सारा पानी,\" उसने धीरे से कहा, \"और इसमें से हमारा कुछ भी नहीं।\"" },
    { en:"The next day, Meera drew a picture for her teacher, Mr. Das. It showed a pipe running from the roof [[gutter|gutter]] into a big plastic drum. A cloth tied over the drum would [[filter|filter]] out leaves and dust. Mr. Das [[studied|studied]] the drawing for a long time. Then he smiled. \"This is called rainwater [[harvesting|harvesting]],\" he said. \"Shall we try it?\"",
      hi:"अगले दिन मीरा ने अपने शिक्षक, दास सर, के लिए एक चित्र बनाया। उसमें छत की नाली से एक पाइप एक बड़े प्लास्टिक के ड्रम तक जा रहा था। ड्रम पर बँधा एक कपड़ा पत्तों और धूल को छान देता। दास सर बहुत देर तक चित्र को ध्यान से देखते रहे। फिर वे मुस्कुराए। \"इसे वर्षा जल संचयन कहते हैं,\" उन्होंने कहा। \"क्या हम इसे आज़माएँ?\"" },
    { en:"The whole class helped. Ravi brought an old drum from his uncle's shop, and the older students fixed the pipe in place. When the [[monsoon|monsoon]] arrived, the drum filled up in just three days. Soon the school had water for the garden and for washing hands. Meera's mother still went to the river sometimes, but now she smiled when she passed the school.",
      hi:"पूरी कक्षा ने मदद की। रवि अपने चाचा की दुकान से एक पुराना ड्रम लाया, और बड़े विद्यार्थियों ने पाइप को ठीक से लगाया। जब मानसून आया, तो ड्रम सिर्फ़ तीन दिनों में भर गया। जल्द ही स्कूल में बगीचे और हाथ धोने के लिए पानी हो गया। मीरा की माँ अब भी कभी-कभी नदी जाती थीं, लेकिन अब स्कूल के पास से गुज़रते हुए वे मुस्कुरा देती थीं।" }
  ]
};
const GLOSS = {
  rolled:{w:"rolled in",m:"came slowly and filled the sky",hi:"घिर आए",ex:"Dark clouds rolled in."},
  disappear:{w:"disappear",m:"to go out of sight",hi:"गायब होना",ex:"The sun will disappear soon."},
  gutter:{w:"gutter",m:"a channel on a roof edge that carries rainwater",hi:"परनाला",ex:"The gutter was full of leaves."},
  filter:{w:"filter",m:"to clean a liquid by catching the dirt",hi:"छानना",ex:"We filter the tea."},
  studied:{w:"studied",m:"looked at carefully",hi:"ध्यान से देखा",ex:"She studied the map."},
  harvesting:{w:"harvesting",m:"collecting and saving something to use later",hi:"संचयन",ex:"We are harvesting rainwater."},
  monsoon:{w:"monsoon",m:"the season of heavy rain in India",hi:"मानसून",ex:"The monsoon starts in June."}
};
const KEYWORDS=["harvesting","gutter","filter","monsoon"];

/* ================= Text processing ================= */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten"};
const norm=w=>{ w=w.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]/g,""); if(NUM[w]) w=NUM[w]; if(w==="mr") w="mister"; return w; };
const ALLNW=[];   // every word in the passage, in order (for read along)
P.paras.forEach(p=>{
  let plain="",html="",offs=[],wCum=[],tot=0,last=0,m; const re=/\[\[(.+?)\|(.+?)\]\]/g, segs=[];
  p.start=ALLNW.length;
  while((m=re.exec(p.en))){ if(m.index>last) segs.push({t:p.en.slice(last,m.index)}); segs.push({t:m[1],k:m[2]}); last=re.lastIndex; }
  if(last<p.en.length) segs.push({t:p.en.slice(last)});
  segs.forEach(s=>{ let inner="";
    s.t.split(/(\s+)/).forEach(tok=>{ if(!tok) return;
      if(/^\s+$/.test(tok)){ inner+=tok; plain+=tok; return; }
      offs.push(plain.length); plain+=tok;
      // weight for estimating where each word falls in the narration audio (pauses after punctuation)
      tot+= tok.replace(/[^\w]/g,"").length+1.5 + (/[.!?]["”]?$/.test(tok)?12:/[,;:]["”]?$/.test(tok)?2:0);
      wCum.push(tot);
      inner+=`<span class="w" data-gi="${ALLNW.length}">${esc(tok)}</span>`; ALLNW.push(norm(tok)); });
    html+= s.k?`<span class="tw" data-k="${s.k}" role="button" tabindex="0">${inner}</span>`:inner; });
  p.plain=plain; p.html=html; p.offs=offs; p.wCum=wCum; p.wTot=tot; p.count=offs.length;
});

function starCount(){ let n=0; Object.values(st.qa).forEach(a=>{ if(a.correct&&a.tries===1) n++; }); if(st.sum===SUMMARY.a&&st.sumTries===1) n++; return n; }

/* ================= Audio engine =================
   Recorded files in vo/ (listed in vo/manifest.json with their playback speed) play first.
   Anything without a file falls back to the browser's voice. */
let MAN=new Map();
// timings: { "para-0": [start second of each word, ...] } measured by make_vo.py
let TIM={};
// Load the audio list before the first page, so the browser voice never starts by mistake
const audioReady=Promise.race([
  Promise.all([
    fetch("vo/manifest.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(m=>{ MAN=new Map(Array.isArray(m)?m.map(k=>[k,1]):Object.entries(m)); }).catch(()=>{}),
    fetch("vo/timings.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(t=>{ TIM=t||{}; }).catch(()=>{})
  ]),
  new Promise(r=>setTimeout(r,2000))
]);
const SLOW=.8;   // Slow mode = 80% of the normal pace
const spd=key=>(MAN.get(key)||1)*(st.rate<1?SLOW:1);
let cur=null, tick=null, ttsT=null, partT=null, pendingVO=null, fbTimer=null, bTimeout=null;
function voice(){ try{ const vs=speechSynthesis.getVoices(); return vs.find(v=>/en-IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang)); }catch(e){} }
function tts(text,rate){
  try{ if(!("speechSynthesis"in window)||!text) return null; speechSynthesis.cancel(); clearTimeout(ttsT);
    const u=new SpeechSynthesisUtterance(text); const v=voice(); if(v) u.voice=v; u.lang=v?v.lang:"en-IN"; u.rate=rate;
    ttsT=setTimeout(()=>speechSynthesis.speak(u),60); return u; }catch(e){ return null; }
}
// Only one sound at a time. Every play gets a ticket; anything from an older ticket is ignored,
// so a stopped or blocked clip can never start again by itself later.
let ticket=0;
function playFile(key,rate,onend){
  const my=++ticket;
  const a=new Audio(`vo/${encodeURIComponent(key)}.m4a`);
  a.preservesPitch=true; a.playbackRate=rate; cur=a;
  a.onended=()=>{ if(my!==ticket) return; cur=null; markPlaying(null); onend&&onend(); };
  const p=a.play();
  if(p) p.catch(()=>{ if(my!==ticket) return; cur=null; markPlaying(null); });   // blocked: stay silent, the speaker button replays it
  return a;
}
function killAudio(a){ a.onended=null; a.pause(); a.removeAttribute("src"); try{ a.load(); }catch(e){} }
function stopAll(){
  ticket++;
  if(cur){ killAudio(cur); cur=null; }
  clearInterval(tick); clearInterval(fbTimer); clearTimeout(bTimeout); clearTimeout(ttsT); clearTimeout(partT); tick=fbTimer=null;
  try{ if("speechSynthesis"in window) speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll(".w.now").forEach(w=>w.classList.remove("now"));
  markPlaying(null);
  if(st.reading!==null){ st.reading=null; paintRbar(); }
}
function markPlaying(key){ document.querySelectorAll(".mini.playing").forEach(b=>b.classList.remove("playing")); if(key) document.querySelectorAll(`.mini[data-k="${key}"]`).forEach(b=>b.classList.add("playing")); }
const heard=new Set();
function vo(key,force,then){
  if((!st.voOn&&!force)||st.listening) return;
  stopAll(); markPlaying(key);
  if(MAN.has(key)){ const a=playFile(key,spd(key),then); a.addEventListener("playing",()=>heard.add(key)); }
  else { const u=tts((VO_LINES[key]||"").replace(/\[\[.*?\]\]/g,""),st.rate<1?.6:.8);
    if(u){ u.onstart=()=>heard.add(key); u.onend=()=>{ markPlaying(null); then&&then(); }; } }
}
let titleFirst=false;
function sayWord(text){
  stopAll(); const k="w-"+norm(text);
  if(MAN.has(k)) playFile(k,spd(k)); else tts(text,st.rate<1?.5:.75);
}
function hl(gi){
  document.querySelectorAll("#passage .w.now").forEach(w=>w.classList.remove("now"));
  const el=document.querySelector(`#passage .w[data-gi="${gi}"]`); if(!el) return;
  el.classList.add("now");
  const b=el.getBoundingClientRect(); if(b.bottom>innerHeight-110||b.top<130) scrollTo({top:scrollY+b.top-innerHeight/2.6,behavior:"smooth"});
}
// Listen: reads the whole story, paragraph after paragraph, always from the start
function listen(){ stopAll(); if(st.listening) stopMic(); hidePop(); st.reading=0; paintRbar(); playPart(0); }
function playPart(i){
  if(st.reading===null) return;
  if(i>=P.paras.length){ stopAll(); return; }
  st.reading=i;
  const p=P.paras[i], key=`para-${i}`, next=()=>{ if(st.reading===i){ clearInterval(tick); partT=setTimeout(()=>playPart(i+1),450); } };
  if(MAN.has(key)){
    const a=playFile(key,spd(key),next), T=TIM[key];
    let shown=-1;
    tick=setInterval(()=>{
      let k;
      if(T&&T.length===p.count){   // exact: measured start time of every word
        const t=a.currentTime; k=0; while(k<T.length-1&&T[k+1]<=t) k++;
        if(t<T[0]-0.05) return;
      } else {                     // fallback: estimate from word lengths
        if(!a.duration||isNaN(a.duration)) return;
        const target=(a.currentTime/a.duration)*p.wTot*1.02; k=0; while(k<p.count-1&&p.wCum[k]<target) k++;
      }
      if(k!==shown){ shown=k; hl(p.start+k); }
    },30);
    return;
  }
  let got=false;
  const fallback=()=>{ let wi=0; hl(p.start); fbTimer=setInterval(()=>{ wi++; if(wi>=p.count){ clearInterval(fbTimer); next(); return; } hl(p.start+wi); },60000/(st.rate<1?80:110)); };
  try{
    if(!("speechSynthesis"in window)) return fallback();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(p.plain); const v=voice(); if(v) u.voice=v; u.lang=v?v.lang:"en-IN"; u.rate=st.rate<1?.55:.75;
    u.onboundary=e=>{ if(e.name&&e.name!=="word")return; got=true; clearInterval(fbTimer); clearTimeout(bTimeout);
      let wi=0; for(let k=0;k<p.offs.length;k++){ if(p.offs[k]<=e.charIndex) wi=k; else break; } hl(p.start+wi); };
    u.onend=()=>{ if(got) next(); };
    speechSynthesis.speak(u);
    bTimeout=setTimeout(()=>{ if(!got&&st.reading===i) fallback(); },900);
  }catch(e){ fallback(); }
}

const qh=(text,key,cls="")=>`<div class="qrow"><p class="q ${cls}">${text}</p><button class="mini" data-act="replay" data-k="${key}" aria-label="Hear it">${I.spk}</button></div>`;

/* ================= Read along: highlight words as the learner reads aloud ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, consumed=[];
function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(prev[j]+1,c[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=c; } return prev[n]; }
function similar(said,target){ if(!said||!target) return false; if(said===target) return true; const L=target.length; if(L<=3) return false; return lev(said,target)<=(L>=7?2:1); }
function feed(spoken){
  const r=raState(); if(r.done) return;
  const w=norm(spoken); if(!w) return;
  const end=Math.min(r.pos+4,ALLNW.length);
  for(let j=r.pos;j<end;j++){ if(similar(w,ALLNW[j])){ for(let k=r.pos;k<j;k++) r.marks[k]="skip"; r.marks[j]="ok"; r.pos=j+1; break; } }
  if(r.pos>=ALLNW.length){ r.done=true; stopMic(); render(true); setTimeout(()=>vo("ra-done"),200); return; }
  paintRA();
}
function paintRA(){
  const r=st.ra;
  document.querySelectorAll("#passage .w").forEach(el=>{ const k=+el.dataset.gi;
    el.classList.toggle("ok",!!r&&r.marks[k]==="ok"); el.classList.toggle("skip",!!r&&r.marks[k]==="skip"); el.classList.toggle("cur",!!r&&st.listening&&k===r.pos); });
  const c=document.querySelector("#passage .w.cur");
  if(c){ const b=c.getBoundingClientRect(); if(b.bottom>innerHeight-110||b.top<130) scrollTo({top:scrollY+b.top-innerHeight/2.6,behavior:"smooth"}); }
}
function startMic(){
  if(!SR){ toast("Read along needs Chrome or Edge."); return; }
  if(!window.isSecureContext){ toast("Open this page from http://localhost to use the microphone."); return; }
  stopAll(); hidePop(); raState();
  rec=new SR(); rec.lang="en-IN"; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  consumed=[];   // fresh session: speech from before a pause is never matched again
  rec.onresult=e=>{ for(let r=e.resultIndex;r<e.results.length;r++){ const words=e.results[r][0].transcript.trim().split(/\s+/).filter(Boolean); const done=consumed[r]||0;
      for(let k=done;k<words.length;k++) feed(words[k]); consumed[r]=Math.max(done,words.length); } };
  rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ toast("Microphone is blocked. Allow it in the address bar and try again."); stopMic(); render(true); }
    else if(e.error==="network"){ toast("Read along needs an internet connection in Chrome."); stopMic(); render(true); } };
  rec.onend=()=>{ if(st.listening){ consumed=[]; try{ rec.start(); }catch(_){ } } };
  try{ rec.start(); st.listening=true; }catch(e){ toast("Could not start the microphone."); }
  paintRbar(); paintRA();
}
function stopMic(){ st.listening=false; if(rec){ rec.onend=null; try{ rec.abort(); }catch(e){} rec=null; } consumed=[]; paintRbar(); paintRA(); }
function resetRA(){ stopMic(); st.ra=null; render(true); }

function placePop(){
  if(!popFor) return; const pop=$("pop");
  const r=popFor.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;

  <div class="opts">${SUMMARY.o.map((o,j)=>{const ok=st.sum===SUMMARY.a; let c=""; if(ok&&j===SUMMARY.a)c="right"; else if(st.wrongSum.includes(j))c="wrong";
    return `<button class="opt ${c}" data-act="sum" data-i="${j}" ${ok||c?"disabled":""}>${o}</button>`}).join("")}</div>
  ${st.sum===SUMMARY.a?`<p class="note good">Yes. It tells the problem, the idea and what happened.</p>`:st.sum!==null?`<p class="note bad">${SUMMARY.why[st.sum]}</p>`:""}`,
reflect:()=>`<div style="display:flex;flex-direction:column;gap:10px">
    <div class="qrow"><label for="refl" class="q">Where have you seen water go to waste near you?</label><button class="mini" data-act="replay" data-k="reflect" aria-label="Hear it">${I.spk}</button></div>
    <textarea id="refl" placeholder="Near my home, water is wasted when…">${esc(st.refl)}</textarea><p class="small">Optional</p></div>`,
done:()=>{ const n=starCount(), r=st.ra, ok=r?r.marks.filter(x=>x==="ok").length:0;
  return `<div style="padding-top:5vh;display:flex;flex-direction:column;gap:6px">
    <div class="qrow"><p class="small" style="flex:1">You finished ${P.title}</p><button class="mini" data-act="replay" data-k="done-${n}" aria-label="Hear it">${I.spk}</button></div>
    <div class="score">${n}<span style="font-size:1.75rem;color:var(--muted)"> / ${MAX}</span></div><p class="sub">stars for first-try answers</p></div>
  <div class="list">${QUESTIONS.map((q,i)=>{const a=st.qa[i];return `<div><span>${q.skill}</span><span>${!a?"Not tried":a.tries===1?"First try":"With help"}</span></div>`}).join("")}
    <div><span>Reading aloud</span><span>${r&&r.pos>0?`${ok} of ${ALLNW.length} words clear`:"Not tried"}</span></div></div>`;
}
};

function paintRbar(){
  const on=STEPS[st.s].id==="read"; $("rbar").hidden=!on; if(!on) return;
  const r=st.ra;
  $("rbarIn").innerHTML=`
    <button class="pill ${st.reading!==null?"on":""}" data-act="listen" aria-label="${st.reading!==null?"Stop":"Listen to the story"}">${st.reading!==null?I.stop:I.spk}<span class="lbl">${st.reading!==null?"Stop":"Listen"}</span></button>
    <div class="seg2" role="group" aria-label="Reading speed">
      <button class="${st.rate<1?"on":""}" data-act="rate" data-v="0.7" aria-pressed="${st.rate<1}">Slow</button>
      <button class="${st.rate>=1?"on":""}" data-act="rate" data-v="1" aria-pressed="${st.rate>=1}">Normal</button></div>
    <span class="spacer"></span>
    <button class="pill ${st.listening?"rec":""}" data-act="mic" aria-label="${st.listening?"Pause reading aloud":"Read aloud"}">${st.listening?'<span class="dot"></span>':I.mic}<span class="lbl">${st.listening?"Pause":(r&&r.pos>0&&!r.done?"Resume":"Read")}</span></button>`;
}
function paintHeader(){
  const b=$("voBtn"); b.innerHTML=st.voOn?I.spk:I.mute; b.classList.toggle("off",!st.voOn);
  b.setAttribute("aria-pressed",st.voOn); b.setAttribute("aria-label",st.voOn?"Voice-over on":"Voice-over off"); b.title=st.voOn?"Voice-over on":"Voice-over off";
  $("fsDown").disabled=st.fs===0; $("fsUp").disabled=st.fs===FS.length-1;
  document.documentElement.style.fontSize=(16*FS[st.fs])+"px";
}
function barHTML(){
  const id=STEPS[st.s].id, go=(t,dis,act="next")=>`<button class="go" data-act="${act}" ${dis?"disabled":""}>${t}</button>`;
  if(id==="read") return `<button class="tool" data-act="tools" aria-label="Reading settings">${I.aa}</button>
      <button class="tool ${st.hiOn?"on":""}" data-act="hion" aria-label="Show in Hindi" aria-pressed="${st.hiOn}">${I.hi}</button>${go("Questions")}`;
  if(id==="quiz"){ const a=st.qa[st.q]; return go(st.q<QUESTIONS.length-1?"Next":"Continue",!(a&&a.correct),"qnext"); }
  if(id==="summary") return go("Continue",st.sum!==SUMMARY.a);
  if(id==="reflect") return go("Finish");
  return go("Read again",false,"restart");
}
let lastScreen=null;
function render(keepMic){
  stopAll(); hidePop(); if(!keepMic&&st.listening) stopMic();
  const step=STEPS[st.s];
  $("view").innerHTML=V[step.id]();
  $("bar").innerHTML=barHTML();
  $("step").textContent=step.label;
  $("backBtn").style.visibility= st.s===0||step.id==="done"?"hidden":"visible";
  let p=st.s/(STEPS.length-1);
  if(step.id==="quiz") p=(st.s+(st.q+(st.qa[st.q]&&st.qa[st.q].correct?1:0))/QUESTIONS.length)/(STEPS.length-1);
  $("prog").style.width=Math.round(p*100)+"%";
  document.body.classList.toggle("t-cream",step.id==="read"&&st.tint==="cream");
  document.body.classList.toggle("t-blue",step.id==="read"&&st.tint==="blue");
  const rf=$("refl"); if(rf) rf.addEventListener("input",e=>st.refl=e.target.value);
  paintHeader(); paintRbar(); if(step.id==="read") paintRA(); renderSheet();
  const key=screenKey();
  if(key!==lastScreen){ lastScreen=key; setTimeout(screenVO,150); }   // each new page plays its voice-over once
}
function keep(){ const y=scrollY; render(true); scrollTo(0,y); }

function renderSheet(){
  const s=st.sheet; if(!s){ $("sheet").innerHTML=""; return; }
  let h="";
  if(s.type==="look"){ const q=QUESTIONS[st.q],p=P.paras[q.ref];
    h=`<p class="small">From the story</p><p style="margin:0;font-size:1.125rem;line-height:1.8">${esc(p.plain).replace(esc(q.quote),`<mark>${esc(q.quote)}</mark>`)}</p>
      <button class="btn2 pri" data-act="close">Try again</button>`;
  } else if(s.type==="tools"){
    const seg=(act,opts,c)=>`<div class="seg">${opts.map(([v,l,css])=>`<button class="${c===v?"on":""}" data-act="${act}" data-v="${v}" ${css?`style="${css}"`:""}>${l}</button>`).join("")}</div>`;
    h=`<div class="srow"><span>Font</span>${seg("font",[["std","Standard"],["alt","Easy-read","font-family:var(--f-alt)"]],st.font)}</div>
      <div class="srow"><span>Spacing</span>${seg("wide",[["0","Normal"],["1","Wide"]],st.wide?"1":"0")}</div>
      <div class="srow"><span>Page colour</span>${seg("tint",[["none","Plain"],["cream","Cream"],["blue","Blue"]],st.tint)}</div>
      <p class="small" style="font-size:13px">Use A− and A+ at the top to change text size.</p>
      <button class="btn2 pri" data-act="close">Done</button>`;
  } else if(s.type==="features"){
    const pl={must:"Must-have",good:"Good-to-have",later:"Later"};
    h=`<h2>Feature list</h2>`+FEATURES.map(g=>`<div class="fgroup"><h3>${g.g}</h3>${g.items.map(([n,pr,d])=>`<div class="feat"><b>${n}</b><span class="prio ${pr}">${pl[pr]}</span><p>${d}</p></div>`).join("")}</div>`).join("")+
      `<button class="btn2 pri" data-act="close">Close</button>`;
  }
  $("sheet").innerHTML=`<div class="veil" data-act="veil"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
}

/* ================= Events ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t){
    const tw=e.target.closest("#passage .tw");
    if(tw){ if(popFor===tw){ hidePop(); return; } sayWord(GLOSS[tw.dataset.k].w); showPop(tw); return; }
    const w=e.target.closest("#passage .w");
    if(w){ hidePop(); sayWord(w.textContent); w.classList.add("now"); setTimeout(()=>w.classList.remove("now"),600); return; }
    if(!e.target.closest("#pop")) hidePop();
    return;
  }
  const a=t.dataset.act,i=+t.dataset.i,v=t.dataset.v;
  if(a==="veil"){ if(e.target===t){ st.sheet=null; renderSheet(); } return; }
  switch(a){
    case "fs": { const y=scrollY/Math.max(1,document.body.scrollHeight); st.fs=Math.max(0,Math.min(FS.length-1,st.fs+(+v)));
      try{ localStorage.setItem("fs",st.fs); }catch(_){} paintHeader(); placePop(); scrollTo(0,y*document.body.scrollHeight); break; }
    case "vo-toggle": st.voOn=!st.voOn; try{ localStorage.setItem("vo",st.voOn?"on":"off"); }catch(_){}
      paintHeader(); if(st.voOn) vo(screenKey()); else stopAll(); break;
    case "features": stopAll(); hidePop(); st.sheet={type:"features"}; renderSheet(); break;
    case "replay": if(t.classList.contains("playing")){ stopAll(); break; } pendingVO=null; vo(t.dataset.k,true); break;
    case "next": st.s++; render(); scrollTo(0,0); break;
    case "close": st.sheet=null; renderSheet(); break;
    case "listen": st.reading!==null?stopAll():listen(); break;
    case "rate": { st.rate=+v; const was=st.reading; paintRbar(); if(was!==null){ st.reading=null; stopAll(); st.reading=was; paintRbar(); playPart(was); } break; }
    case "mic": if(st.listening){ stopMic(); render(true); } else startMic(); break;
    case "ra-reset": resetRA(); break;
    case "tools": stopAll(); st.sheet={type:"tools"}; renderSheet(); break;
    case "font": st.font=v; keep(); break;
    case "wide": st.wide=v==="1"; keep(); break;
    case "tint": st.tint=v; keep(); break;
    case "hion": st.hiOn=!st.hiOn; keep(); break;
    case "ans": { const q=QUESTIONS[st.q],x=st.qa[st.q]||{tries:0,wrong:[]}; x.tries++; if(i===q.a) x.correct=true; else x.wrong.push(i); st.qa[st.q]=x; keep();
      vo(i===q.a?(x.tries===1?"q-right1":"q-right2"):"q-wrong"); break; }
    case "seq": { const q=QUESTIONS[st.q]; const k=st.seq.indexOf(i); if(k>-1) st.seq.splice(k,1); else st.seq.push(i);
      if(st.seq.length===q.items.length){ const x=st.qa[st.q]||{tries:0,wrong:[]}; x.tries++; x.correct=st.seq.every((vv,kk)=>vv===q.order[kk]); st.qa[st.q]=x; if(!x.correct) st.seq=[];
        keep(); vo(x.correct?"seq-right":"seq-wrong"); break; }
      keep(); vo(`seqitem-${i}`,true); break; }
    case "look": st.sheet={type:"look"}; renderSheet(); vo("look"); break;
    case "qnext": st.seq=[]; if(st.q<QUESTIONS.length-1) st.q++; else st.s++; render(); scrollTo(0,0); break;
    case "sum": st.sumTries++; st.sum=i; if(i!==SUMMARY.a) st.wrongSum.push(i); keep(); vo(i===SUMMARY.a?"sum-right":`sum-why-${i}`); break;
    case "restart": Object.assign(st,{s:0,pred:null,flipped:new Set(),hiOn:false,q:0,qa:{},seq:[],sum:null,sumTries:0,wrongSum:[],refl:"",sheet:null,ra:null}); lastScreen=null; render(); scrollTo(0,0); break;
  }
});
$("backBtn").addEventListener("click",()=>{
  const id=STEPS[st.s].id;
  if(id==="quiz"&&st.q>0){ st.q--; st.seq=[]; render(); return; }
  if(st.s>0){ st.s--; render(); scrollTo(0,0); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ hidePop(); if(st.sheet){ st.sheet=null; renderSheet(); } }
  const tw=e.target.closest&&e.target.closest(".tw");
  if(tw&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); sayWord(GLOSS[tw.dataset.k].w); showPop(tw); }
});
try{ speechSynthesis.getVoices(); }catch(e){}
audioReady.then(render);
</script>
</body>
</html>
